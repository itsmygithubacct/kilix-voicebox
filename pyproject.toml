[project]
name = "kilix-voicebox-backend"
version = "0.1.12"
description = "Local product orchestration for independent Kilix speech providers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13.0",
  "fastapi>=0.109.0",
  "numpy>=1.24.0",
  "pillow>=10.0.0",
  "pydantic>=2.5.0",
  "python-multipart>=0.0.6",
  "soundfile>=0.12.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.27.0",
]

[dependency-groups]
build = ["pyinstaller==6.15.0"]
dev = ["httpx==0.28.1", "pytest==8.4.1", "ruff==0.12.10"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]
